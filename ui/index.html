<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>旅の素材を集める | My Timeline</title><link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script></head>
<body><main><p class="eyebrow">MY TIMELINE</p><h1>旅の素材を集める</h1><p class="intro">期間を選ぶだけで、投稿と写真をひとつの時系列にまとめます。</p>
<form id="collect-form" action="/api/collect" method="post">
  <div class="dates"><div class="field"><label for="from">開始日</label><input id="from" name="from" type="date" required></div><div class="field"><label for="to">終了日</label><input id="to" name="to" type="date" required></div></div>
  <div class="field"><label for="title">旅行記の名前</label><input id="title" name="title" type="text" maxlength="80" placeholder="例：瀬戸内自転車旅行"></div>
  <fieldset><legend>取得元</legend><div class="sources"><label for="bluesky"><input id="bluesky" name="sources" type="checkbox" value="bluesky" checked><span>Bluesky</span></label><label for="x"><input id="x" name="sources" type="checkbox" value="x" checked><span>Twilog</span></label><label for="flickr"><input id="flickr" name="sources" type="checkbox" value="flickr" checked><span>Flickr</span></label><label for="strava"><input id="strava" name="sources" type="checkbox" value="strava"><span>Strava</span></label></div></fieldset>
  <p class="hint">最大31日。作成物は「ダウンロード」に保存されます。執筆が終わったらFinderから削除できます。</p><button id="submit" type="submit">収集して開く</button>
</form>
<details class="settings"><summary>Strava設定 <span id="strava-status">未確認</span></summary>
  <p class="hint">初回のみ、<a href="https://www.strava.com/settings/api" target="_blank">StravaのAPI設定画面</a>で作成した値を保存します。Authorization Callback Domainは <code>127.0.0.1</code> にしてください。</p>
  <form id="strava-form" action="/api/strava/config" method="post">
    <div class="field"><label for="strava-client-id">Client ID</label><input id="strava-client-id" name="clientId" type="text" inputmode="numeric" pattern="[0-9]+" required></div>
    <div class="field"><label for="strava-client-secret">Client Secret</label><input id="strava-client-secret" name="clientSecret" type="password" required autocomplete="off"></div>
    <div class="field"><label for="strava-access-token">Your Access Token（任意）</label><input id="strava-access-token" name="accessToken" type="password" autocomplete="off"></div>
    <div class="field"><label for="strava-refresh-token">Refresh Token（持っている場合）</label><input id="strava-refresh-token" name="refreshToken" type="password" autocomplete="off"></div>
    <button id="show-strava-secrets" type="button" aria-pressed="false">入力内容を表示</button>
    <button type="submit">設定を保存</button>
  </form>
  <a id="strava-connect" class="connect" href="/api/strava/connect" target="_blank">Stravaに接続</a>
  <p id="strava-message" aria-live="polite"></p>
</details>
<section id="result" class="result" aria-live="polite" aria-atomic="true" hidden><p id="status-text"></p><progress id="progress" hidden></progress><p id="elapsed"></p></section></main></body></html>
